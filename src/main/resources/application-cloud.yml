server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  elasticsearch:
    uris: http://${ELASTICSEARCH_HOST}:9200
llm:
  openai:
    enabled: ${OPENAI_ENABLED:true}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY}
    model: ${OPENAI_MODEL:gpt-5.6-sol}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1200}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    response-timeout: ${OPENAI_RESPONSE_TIMEOUT:20s}
    retry-max-attempts: ${OPENAI_RETRY_MAX_ATTEMPTS:3}
    retry-initial-backoff: ${OPENAI_RETRY_INITIAL_BACKOFF:100ms}
    retry-max-backoff: ${OPENAI_RETRY_MAX_BACKOFF:1s}

stt:
  max-file-size: ${STT_MAX_FILE_SIZE:26214400}
  timeout: ${STT_TIMEOUT:20s}
  openai:
    # Local development must opt in after providing an OpenAI key.
    enabled: ${STT_OPENAI_ENABLED:true}
    base-url: ${STT_OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${STT_OPENAI_API_KEY}
    model: ${STT_OPENAI_MODEL:gpt-4o-mini-transcribe}
    language: ${STT_OPENAI_LANGUAGE:ko}
    connect-timeout: ${STT_OPENAI_CONNECT_TIMEOUT:3s}
tour-api:
  service-key: ${TOUR_API_SERVICE_KEY}
  ingestion:
    enabled: ${TOUR_API_INGESTION_ENABLED:false}
    page-size: ${TOUR_API_INGESTION_PAGE_SIZE:100}
    max-pages: ${TOUR_API_INGESTION_MAX_PAGES:0}
    max-items: ${TOUR_API_INGESTION_MAX_ITEMS:0}
    schedule:
      enabled: ${TOUR_API_INGESTION_SCHEDULE_ENABLED:false}
      cron: ${TOUR_API_INGESTION_SCHEDULE_CRON:0 0 3 * * *}
      zone: ${TOUR_API_INGESTION_SCHEDULE_ZONE:Asia/Seoul}
